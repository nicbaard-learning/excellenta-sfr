[project]
name = "sfr"
version = "0.1.0"
description = "Shared Framework Repository – canonical compliance control library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.1",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pandas>=2.2.2",
    "openpyxl>=3.1.2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
sfr-load-scf = "app.importers.load_scf:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
