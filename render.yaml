# SFR – Shared Framework Repository
# Render Blueprint – https://render.com/docs/blueprint-spec

services:
  - type: web
    name: sfr
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-4} --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false  # Set manually in Render dashboard
      - key: APP_TITLE
        value: "SFR – Shared Framework Repository"
      - key: APP_VERSION
        value: "0.1.0"
      - key: DEBUG
        value: "false"
      - key: WEB_CONCURRENCY
        value: "4"
    healthCheckPath: /health
    autoDeploy: true
