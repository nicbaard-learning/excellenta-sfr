<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SFR Browser{% endblock %} — Shared Framework Repository</title>
  <link rel="stylesheet" href="/static/css/sfr.css">
</head>
<body>
  <!-- GitHub Update Notification Banner -->
  <div id="update-banner" class="update-banner" style="display:none;">
    <div class="update-banner-content">
      <span class="update-banner-icon">⬆</span>
      <span id="update-banner-text">A new version of the SCF framework is available on GitHub.</span>
      <a id="update-banner-link" href="#" target="_blank" class="update-banner-link">View Release →</a>
      <button class="update-banner-close" onclick="dismissBanner()">✕</button>
    </div>
  </div>

  <nav>
    <a href="/" class="brand">SFR <small>Shared Framework Repository</small></a>
    <a href="/frameworks">Frameworks</a>
    <a href="/recommend">Recommend</a>
    <a href="/compare">Compare</a>
    <a href="/about">About</a>
    <a href="/docs" target="_blank">API Docs</a>
  </nav>
  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script>
    // GitHub update check on page load
    async function checkForUpdates() {
      try {
        const resp = await fetch('/api/system/update-check');
        const data = await resp.json();
        if (data.update_available) {
          const banner = document.getElementById('update-banner');
          const text = document.getElementById('update-banner-text');
          const link = document.getElementById('update-banner-link');
          
          if (data.latest_tag) {
            text.textContent = `SCF ${data.latest_tag} is available on GitHub. Current version: ${data.current_tag || 'unknown'}.`;
          } else {
            text.textContent = 'A new version of the SCF framework is available on GitHub.';
          }
          
          if (data.latest_release_url) {
            link.href = data.latest_release_url;
            link.style.display = 'inline';
          } else {
            link.style.display = 'none';
          }
          
          banner.style.display = 'block';
        }
      } catch (err) {
        console.warn('Update check failed:', err);
      }
    }

    function dismissBanner() {
      document.getElementById('update-banner').style.display = 'none';
    }

    // Run on page load (after DOM is ready)
    document.addEventListener('DOMContentLoaded', checkForUpdates);
  </script>
</body>
</html>
